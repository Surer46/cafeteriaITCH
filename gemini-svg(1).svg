<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 840" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra suave -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="active-shadow" x="-10%" y="-15%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="btn-green-glow" x="-10%" y="-20%" width="120%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#16A34A" flood-opacity="0.40"/>
    </filter>
  </defs>

  <style>
    .font-base { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .window-title { fill: #FFFFFF; font-weight: 600; font-size: 14px; }
    
    /* Tipografías de Barra Lateral */
    .brand-title { fill: #FFFFFF; font-weight: 900; font-size: 15px; letter-spacing: 0.8px; }
    .brand-subtitle { fill: #FECACA; font-weight: 500; font-size: 11px; }
    .nav-header { fill: #FCA5A5; font-weight: 700; font-size: 11px; letter-spacing: 1px; }
    .nav-item-inactive { fill: #FFFFFF; font-size: 13px; font-weight: 500; }
    .nav-item-active { fill: #78350F; font-size: 13.5px; font-weight: 800; }

    /* Tipografías de la Pantalla Principal */
    .label-text { fill: #374151; font-weight: 600; font-size: 13px; }
    .table-header-text { fill: #FFFFFF; font-weight: 700; font-size: 13px; }
    .table-data-text { fill: #1F2937; font-size: 13.5px; }
    .total-title { fill: #B91C1C; font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
    .total-price { fill: #D97706; font-weight: 900; font-size: 40px; }
    .btn-cobrar-text { fill: #FFFFFF; font-weight: 800; font-size: 16px; letter-spacing: 0.8px; }
    .btn-action-text { fill: #B91C1C; font-weight: 600; font-size: 13px; }
    .btn-neutral-text { fill: #4B5563; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Fondo base de la ventana -->
  <rect width="1360" height="840" rx="16" fill="#F1F5F9"/>

  <!-- ================= BARRA SUPERIOR DE VENTANA ================= -->
  <path d="M 0,16 Q 0,0 16,0 L 1344,0 Q 1360,0 1360,16 L 1360,42 L 0,42 Z" fill="#991B1B"/>
  <rect x="20" y="14" width="14" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M20 19 L34 19" stroke="#FFFFFF" stroke-width="2"/>
  <text x="44" y="26" class="font-base window-title">CAFETERÍA - CONTROL TOTAL | Sistema Administrativo y Operativo</text>

  <!-- Controles de ventana -->
  <circle cx="1275" cy="21" r="6" fill="#FACC15"/>
  <circle cx="1300" cy="21" r="6" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="1325" cy="21" r="6" fill="#EF4444"/>

  <!-- ================= LATERAL IZQUIERDA: MENÚ DE SECCIONES CON ICONOS ================= -->
  <g filter="url(#card-shadow)">
    <!-- Contenedor del Sidebar -->
    <rect x="20" y="58" width="280" height="762" rx="14" fill="#B91C1C"/>

    <!-- Cabecera del Módulo -->
    <rect x="36" y="74" width="248" height="60" rx="10" fill="#991B1B"/>
    <text x="50" y="98" class="font-base brand-title">CONTROL TOTAL</text>
    <text x="50" y="116" class="font-base brand-subtitle">Cafetería ITCH II • v2.4</text>

    <text x="38" y="160" class="font-base nav-header">MÓDULOS DEL SISTEMA</text>

    <!-- 1. Ver inventario general (Icono Caja de Inventario) -->
    <g transform="translate(36, 172)">
      <rect width="248" height="42" rx="8" fill="#A81313"/>
      <circle cx="20" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.15"/>
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16.5 L20 13 L28 16.5 L20 20 Z"/>
        <path d="M12 16.5 V25 L20 28.5 V20"/>
        <path d="M28 16.5 V25 L20 28.5"/>
      </g>
      <text x="44" y="26" class="font-base nav-item-inactive">Ver inventario general</text>
    </g>

    <!-- 2. Cobrar / Vender (SECCIÓN ACTIVA - Icono Carrito de Compras) -->
    <g transform="translate(36, 222)" filter="url(#active-shadow)">
      <rect width="248" height="46" rx="8" fill="#FACC15"/>
      <circle cx="20" cy="23" r="13" fill="#FEF08A"/>
      <g stroke="#78350F" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="17" cy="28.5" r="1.3" fill="#78350F"/>
        <circle cx="23.5" cy="28.5" r="1.3" fill="#78350F"/>
        <path d="M13 17 H15.2 L17.2 25 H24.5 L26.2 19 H15.8"/>
      </g>
      <text x="44" y="28" class="font-base nav-item-active">Cobrar / Vender</text>
      <!-- Indicador flecha derecha -->
      <path d="M 230,19 L 235,23 L 230,27" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 3. Promociones y combos (Icono Etiqueta de Descuento) -->
    <g transform="translate(36, 276)">
      <rect width="248" height="42" rx="8" fill="#A81313"/>
      <circle cx="20" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.15"/>
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M26 20.5 L21 25.5 A1.5 1.5 0 0 1 19.8 26 L14.5 26.5 L14.5 21.2 A1.5 1.5 0 0 1 15 20 L20 15 A1.5 1.5 0 0 1 22.2 15 L26 18.5 A1.5 1.5 0 0 1 26 20.5 Z"/>
        <circle cx="17.5" cy="23" r="1" fill="#FFFFFF"/>
      </g>
      <text x="44" y="26" class="font-base nav-item-inactive">Promociones y combos</text>
    </g>

    <!-- 4. Reabastecer existencias o insumos (Icono Camión de Carga) -->
    <g transform="translate(36, 326)">
      <rect width="248" height="42" rx="8" fill="#A81313"/>
      <circle cx="20" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.15"/>
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="12" y="15" width="8.5" height="9" rx="1"/>
        <path d="M20.5 18 H24.5 L27 20.5 V24 H20.5"/>
        <circle cx="15" cy="25" r="1.3" fill="#FFFFFF"/>
        <circle cx="23.5" cy="25" r="1.3" fill="#FFFFFF"/>
      </g>
      <text x="44" y="26" class="font-base nav-item-inactive">Reabastecer existencias</text>
    </g>

    <!-- 5. Dar de alta productos y recetas (Icono Documento con Signo +) -->
    <g transform="translate(36, 376)">
      <rect width="248" height="42" rx="8" fill="#A81313"/>
      <circle cx="20" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.15"/>
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 13 H22 A2 2 0 0 1 24 15 V27 A2 2 0 0 1 22 29 H15 A2 2 0 0 1 13 27 V15 A2 2 0 0 1 15 13 Z"/>
        <line x1="18.5" y1="18" x2="18.5" y2="24"/>
        <line x1="15.5" y1="21" x2="21.5" y2="21"/>
      </g>
      <text x="44" y="26" class="font-base nav-item-inactive">Alta productos y recetas</text>
    </g>

    <!-- 6. Dar de baja un producto (Icono Papelera / Eliminar) -->
    <g transform="translate(36, 426)">
      <rect width="248" height="42" rx="8" fill="#A81313"/>
      <circle cx="20" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.15"/>
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 16 H27"/>
        <path d="M18 13.5 H22"/>
        <path d="M15 16 L16 26.5 A1.5 1.5 0 0 0 17.5 28 H22.5 A1.5 1.5 0 0 0 24 26.5 L25 16"/>
        <line x1="18" y1="19.5" x2="18" y2="24.5"/>
        <line x1="22" y1="19.5" x2="22" y2="24.5"/>
      </g>
      <text x="44" y="26" class="font-base nav-item-inactive">Dar de baja un producto</text>
    </g>

    <!-- 7. Ver existencias de barra (Icono Taza de Café Humeante) -->
    <g transform="translate(36, 476)">
      <rect width="248" height="42" rx="8" fill="#A81313"/>
      <circle cx="20" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.15"/>
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 18 H22 V21.5 A3.5 3.5 0 0 1 18.5 25 H17.5 A3.5 3.5 0 0 1 14 21.5 Z"/>
        <path d="M22 19 H24 A1.8 1.8 0 0 1 25.8 20.8 V20.8 A1.8 1.8 0 0 1 24 22.6 H22"/>
        <path d="M13 27.5 H23"/>
        <path d="M16.5 13.5 C16.5 14.8 16 15.2 16 16"/>
        <path d="M19.5 13.5 C19.5 14.8 19 15.2 19 16"/>
      </g>
      <text x="44" y="26" class="font-base nav-item-inactive">Existencias de barra</text>
    </g>

    <!-- 8. Bitácora de movimientos y ventas (Icono Reloj de Historial) -->
    <g transform="translate(36, 526)">
      <rect width="248" height="42" rx="8" fill="#A81313"/>
      <circle cx="20" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.15"/>
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="21" r="7"/>
        <polyline points="20 17 20 21 23 23"/>
      </g>
      <text x="44" y="26" class="font-base nav-item-inactive">Bitácora de movimientos</text>
    </g>

    <!-- 9. Centro de reportes y corte de caja (Icono Gráfico de Barras) -->
    <g transform="translate(36, 576)">
      <rect width="248" height="42" rx="8" fill="#A81313"/>
      <circle cx="20" cy="21" r="13" fill="#FFFFFF" fill-opacity="0.15"/>
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="13" y1="26" x2="27" y2="26"/>
        <line x1="16.5" y1="26" x2="16.5" y2="21"/>
        <line x1="20" y1="26" x2="20" y2="15"/>
        <line x1="23.5" y1="26" x2="23.5" y2="18"/>
      </g>
      <text x="44" y="26" class="font-base nav-item-inactive">Reportes y corte de caja</text>
    </g>

    <!-- Pie del Sidebar: Usuario / Estado -->
    <rect x="36" y="744" width="248" height="60" rx="8" fill="#7F1D1D"/>
    <circle cx="56" cy="774" r="8" fill="#22C55E"/>
    <text x="74" y="770" class="font-base" fill="#FFFFFF" font-weight="700" font-size="12px">Caja Principal • Abierta</text>
    <text x="74" y="785" class="font-base brand-subtitle">Usuario: Cajero 01</text>
  </g>

  <!-- ================= ÁREA DE TRABAJO: PANTALLA PRINCIPAL (PUNTO DE VENTA) ================= -->

  <!-- Panel Superior: Entrada de Código y Cantidad -->
  <g filter="url(#card-shadow)">
    <rect x="320" y="58" width="696" height="96" rx="14" fill="#FFFFFF"/>
    
    <text x="336" y="84" class="font-base label-text">Código de barras o Nombre:</text>
    <rect x="336" y="94" width="378" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="348" y1="104" x2="348" y2="126" stroke="#B91C1C" stroke-width="2"/>

    <text x="730" y="84" class="font-base label-text">Cantidad:</text>
    <rect x="730" y="94" width="94" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="746" y="121" class="font-base table-data-text" font-weight="700">1</text>
    <path d="M 804,108 L 809,103 L 814,108" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 804,122 L 809,127 L 814,122" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Botón Agregar (+) -->
    <rect x="840" y="94" width="160" height="42" rx="8" fill="#B91C1C"/>
    <text x="920" y="120" class="font-base" fill="#FFFFFF" font-weight="700" font-size="14px" text-anchor="middle">Agregar (+)</text>
  </g>

  <!-- Panel Central: Grilla de Productos -->
  <g filter="url(#card-shadow)">
    <rect x="320" y="172" width="696" height="648" rx="14" fill="#FFFFFF"/>

    <!-- Cabecera de la Tabla -->
    <path d="M 320,186 Q 320,172 334,172 L 1002,172 Q 1016,172 1016,186 L 1016,216 L 320,216 Z" fill="#991B1B"/>
    <text x="338" y="198" class="font-base table-header-text">SKU</text>
    <text x="440" y="198" class="font-base table-header-text">Descripción del Producto</text>
    <text x="740" y="198" class="font-base table-header-text">P. Unitario</text>
    <text x="850" y="198" class="font-base table-header-text">Cant.</text>
    <text x="930" y="198" class="font-base table-header-text">Subtotal</text>

    <!-- Fila 1 (Seleccionada) -->
    <rect x="321" y="216" width="694" height="48" fill="#FEF3C7"/>
    <rect x="321" y="216" width="4" height="48" fill="#F59E0B"/>
    <text x="338" y="246" class="font-base" fill="#B45309" font-weight="700">R02</text>
    <text x="440" y="246" class="font-base table-data-text" font-weight="600">Chocolaleche</text>
    <text x="740" y="246" class="font-base table-data-text">$30.00</text>
    <text x="860" y="246" class="font-base table-data-text">1</text>
    <text x="930" y="246" class="font-base table-data-text" font-weight="700">$30.00</text>
    <line x1="320" y1="264" x2="1016" y2="264" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Fila 2 -->
    <rect x="321" y="265" width="694" height="48" fill="#FFFFFF"/>
    <text x="338" y="295" class="font-base table-data-text">4025</text>
    <text x="440" y="295" class="font-base table-data-text">Coca Cola Lat 473ml</text>
    <text x="740" y="295" class="font-base table-data-text">$25.00</text>
    <text x="860" y="295" class="font-base table-data-text">116</text>
    <text x="930" y="295" class="font-base table-data-text" font-weight="700">$2900.00</text>
    <line x1="320" y1="313" x2="1016" y2="313" stroke="#F1F5F9" stroke-width="1.5"/>
  </g>

  <!-- ================= PANEL DERECHO: TOTALES Y COBRO ================= -->
  <g filter="url(#card-shadow)">
    <rect x="1034" y="58" width="306" height="762" rx="14" fill="#FFFFFF"/>

    <!-- Bloque de Resumen: Total a Pagar -->
    <rect x="1050" y="74" width="274" height="118" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="1066" y="104" class="font-base total-title">TOTAL A PAGAR:</text>
    <text x="1066" y="156" class="font-base total-price">$2930.00</text>

    <!-- Botón Principal: COBRAR TICKET (Verde Esmeralda) -->
    <g filter="url(#btn-green-glow)">
      <rect x="1050" y="210" width="274" height="64" rx="12" fill="#16A34A"/>
      <path d="M 1062,216 L 1312,216" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <path d="M 1062,268 L 1312,268" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
      <text x="1187" y="248" class="font-base btn-cobrar-text" text-anchor="middle">COBRAR TICKET</text>
    </g>

    <!-- Botones de Acción Operativa Inmediata -->
    <rect x="1050" y="324" width="274" height="46" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="1187" y="352" class="font-base btn-action-text" text-anchor="middle">Quitar Artículo Seleccionado</text>

    <rect x="1050" y="384" width="274" height="46" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <text x="1187" y="412" class="font-base btn-action-text" text-anchor="middle">Cancelar Orden Completa</text>

    <rect x="1050" y="482" width="274" height="46" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
    <text x="1187" y="510" class="font-base" fill="#C2410C" font-weight="700" font-size="13px" text-anchor="middle">Corte de Turno Rápido</text>

    <rect x="1050" y="542" width="274" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1187" y="570" class="font-base btn-neutral-text" text-anchor="middle">Consultar Catálogo Rápido</text>
  </g>
</svg>
